name: mood_tracker
description: "App to track mood with an emotion matrix (energy and pleasantness)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  table_calendar: ^3.0.9
  bloc: ^9.2.0
  injectable: ^2.7.1+4
  get_it: ^9.2.0
  intl: ^0.20.2
  path_provider: ^2.1.2
  animated_toggle_switch: ^0.8.5
  syncfusion_flutter_sliders: ^32.1.22
  syncfusion_flutter_core: ^32.1.22
  nested: ^1.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_colorpicker: ^1.1.0
  shared_preferences: ^2.5.4
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  injectable_generator: ^2.6.2
  intl_utils: ^2.8.8

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - shorebird.yaml

flutter_intl:
  enabled: true
  arb_dir: assets/l10n
  output_dir: lib/presentation/shared/assets

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"